<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>English7VPR — Письмо</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #e9e9e9;
      color: #2b2b2b;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      position: relative;
      background: #e9e9e9;
      border-top: 2px solid #b7c9d0;
      border-bottom: 2px solid #b7c9d0;
    }

    .header {
      height: 36px;
      display: flex;
      align-items: center;
      padding-left: 10px;
      font-size: 14px;
      color: #1f2c33;
      background: linear-gradient(#eeeeee, #dedede);
      border-bottom: 2px solid #b7c9d0;
    }

    .main {
      max-width: 980px;
      margin: 0 auto;
      padding: 45px 20px 80px;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .top-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 55px;
    }

    .back-link {
      color: #2e3a40;
      text-decoration: none;
      font-size: 15px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.4px;
    }

    .subtitle {
      margin: -30px auto 55px;
      max-width: 680px;
      font-size: 18px;
      line-height: 1.5;
      color: #3e5964;
    }

    .variants {
      display: grid;
      grid-template-columns: repeat(2, 260px);
      gap: 34px 80px;
      justify-content: center;
    }

    .variant-button {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;

      text-decoration: none;
      color: #2e3a40;
      font-size: 20px;
      font-weight: 400;
      text-transform: uppercase;

      background: #b7c4ca;
      border: 1.5px solid #111;

      clip-path: polygon(
        8% 0,
        92% 0,
        100% 50%,
        92% 100%,
        8% 100%,
        0 50%
      );

      transition: 0.2s;
    }

    .variant-button:hover {
      background: #a7b8bf;
      transform: translateY(-2px);
    }

    .decor-arrow {
      position: absolute;
      top: 76px;
      left: -3px;
      width: 145px;
      height: 50px;
      border: 1px solid #8aa2ad;
      opacity: 0.8;
      clip-path: polygon(
        0 0,
        82% 0,
        100% 50%,
        82% 100%,
        0 100%
      );
    }

    .decor-circle {
      position: absolute;
      right: -90px;
      bottom: 70px;
      width: 180px;
      height: 180px;
      border: 1px solid #607985;
      border-radius: 50%;
      opacity: 0.6;
    }

    @media (max-width: 720px) {
      .top-line {
        flex-direction: column;
        margin-bottom: 45px;
      }

      h1 {
        font-size: 25px;
      }

      .subtitle {
        margin-bottom: 40px;
        font-size: 16px;
      }

      .variants {
        grid-template-columns: 260px;
        gap: 26px;
      }

      .decor-arrow,
      .decor-circle {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="header">
      English7VPR
    </header>

    <main class="main">
      <div class="top-line">
        <a href="index.html" class="back-link">← На главную</a>
        <h1>Письмо</h1>
        <span></span>
      </div>

      <p class="subtitle">
        Выберите вариант. В каждом задании нужно написать ответ на письмо.
        После завершения появятся чек-лист и примерный ответ.
      </p>

      <div class="variants">
        <a href="writing-1.html" class="variant-button">Вариант 1</a>
        <a href="writing-2.html" class="variant-button">Вариант 2</a>
        <a href="writing-3.html" class="variant-button">Вариант 3</a>

        <a href="writing-4.html" class="variant-button">Вариант 4</a>
        <a href="writing-5.html" class="variant-button">Вариант 5</a>
        <a href="writing-6.html" class="variant-button">Вариант 6</a>

        <a href="writing-7.html" class="variant-button">Вариант 7</a>
        <a href="writing-8.html" class="variant-button">Вариант 8</a>
        <a href="writing-9.html" class="variant-button">Вариант 9</a>
        
        <a href="writing-10.html" class="variant-button">Вариант 10</a>
      </div>
    </main>

    <div class="decor-arrow"></div>
    <div class="decor-circle"></div>
  </div>
</body>
</html>
